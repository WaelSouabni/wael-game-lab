<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trouve l’ombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece4ff;--tint:#d8c9ff;--ink:#2b2150;--soft:#665c94;--leaf:#2f8f55;--card:#ffffff;--sun:#ffc83d;--ring:#2b2150;--paper:#f6f2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1534;--tint:#2e2457;--ink:#f1ecff;--soft:#b9afdc;--leaf:#5fcf88;--card:#2a2250;--sun:#ffd25e;--ring:#f1ecff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1534;--tint:#2e2457;--ink:#f1ecff;--soft:#b9afdc;--leaf:#5fcf88;--card:#2a2250;--sun:#ffd25e;--ring:#f1ecff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka','Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
[dir=rtl] body,[dir=rtl] button{font-family:'Cairo','Fredoka',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ring);outline-offset:3px}
.app{max-width:620px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:700;line-height:1.1}
.tools{display:flex;gap:8px}
.tool{min-width:48px;height:48px;border-radius:16px;border:3px solid var(--ink);background:var(--card);font-weight:600;font-size:1.05rem;padding:0 12px}
a.tool.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem}
.dots{display:flex;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
.dot.done{background:var(--leaf)}.dot.now{background:var(--sun)}
.target{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:16px;text-align:center}
.target span{display:block;font-size:clamp(5rem,26vw,8rem);line-height:1.1}
.target p{margin:0;font-weight:600;font-size:1.2rem;color:var(--soft)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sh{aspect-ratio:1;border:4px solid var(--ink);border-radius:24px;background:var(--paper);display:grid;place-items:center;padding:0}
.sh span{font-size:clamp(3.4rem,17vw,5rem);line-height:1;filter:brightness(0);opacity:.85;transition:filter .3s}
.sh.found{background:color-mix(in srgb,var(--leaf) 30%,var(--paper));border-color:var(--leaf);animation:pop .4s}
.sh.found span{filter:none;opacity:1}
.sh.wrong{animation:wob .4s;opacity:.55}
.sh.hint{animation:pulse .8s 4;border-color:var(--sun);border-width:6px}
.sh:active{transform:scale(.95)}
.msg{font-size:1.3rem;font-weight:600;text-align:center;min-height:2.2em;margin:0}
.big{display:block;margin:0 auto;border:4px solid var(--ink);border-radius:22px;background:var(--sun);color:#2b2150;font-weight:700;font-size:1.4rem;padding:14px 32px;min-height:60px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:18px;text-align:center}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 0;padding:0;list-style:none}
.badge{background:var(--tint);border-radius:18px;padding:10px 14px;font-weight:600}
.badge b{display:block;font-size:2rem}.badge small{display:block;color:var(--soft);font-weight:400}
[hidden]{display:none!important}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes wob{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title"></h1><div class="tools"><a class="tool home" href="menu-accueil.html" aria-label="Accueil / الصفحة الرئيسية" title="Accueil / الصفحة الرئيسية">⌂</a><button class="tool" id="snd" aria-pressed="true"></button><button class="tool" id="lang"></button></div></header>
  <div class="dots" id="dots" role="img"></div>
  <main id="game" style="display:flex;flex-direction:column;gap:14px">
    <div class="target"><span id="tg" aria-hidden="true"></span><p id="tq"></p></div>
    <div class="choices" id="choices"></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p id="vnote" hidden style="margin:0;text-align:center;font-size:1rem;color:var(--soft)">لا يوجد صوت عربي على هذا الجهاز. Pas de voix arabe sur cet appareil : installe-la dans Réglages, Synthèse vocale.</p>
    <button class="big" id="next" hidden></button>
  </main>
  <section class="panel" id="end" hidden><h2 id="endT"></h2><ul class="badges" id="badges"></ul><button class="big" id="again" style="margin-top:16px"></button></section>
</div>
<script>
// LOGIC-START
const DISTINCT=['🐘','🐟','🦒','🐢','🚗','✈️','🌻','🏠','🎈','⛵','🦋','🐙','🍌','🚲'];
const SIMILAR=[['🐱','🐶','🐰','🐻'],['🐓','🦆','🐧','🦉'],['🍎','🍅','🍒','🍑']];
const ROUNDS=[{k:2},{k:3},{k:3,sim:true},{k:4},{k:4,sim:true},{k:4,sim:true}];
const TOTAL_LEVELS=ROUNDS.length;
function shuffle(a,rng){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function buildRound(n,rng){rng=rng||Math.random;const c=ROUNDS[n-1];
const pool=c.sim?shuffle(SIMILAR[Math.floor(rng()*SIMILAR.length)],rng):shuffle(DISTINCT,rng);
const choices=pool.slice(0,c.k);return{target:choices[Math.floor(rng()*choices.length)],choices:shuffle(choices,rng)};}
function isRight(r,e){return r.target===e;}
function needsHint(e){return e>=2;}
function badgesFor(s){const b=[];if(s.errors>=3)b.push('perseverant');if(s.errors===0)b.push('observer');return b;}
function finalBadges(done){return done>=TOTAL_LEVELS?['detective']:[];}
// LOGIC-END
const T={
fr:{title:'Trouve l’ombre',sound:'Son',next:'Suite',again:'Rejouer',endT:'Bravo, petit détective !',tq:'Quelle est son ombre ?',
 hello:'Regarde bien la forme, puis touche son ombre.',ok:['Bravo !','Tu as trouvé !','Super, bien vu !'],
 retry:['Pas celle-ci. Regarde bien la forme !','Presque ! Essaie une autre ombre.','On réessaie ensemble !'],hint:'Regarde, cette ombre brille !',levelDone:'Tu as un super regard !',lvl:'Manche',of:'sur',
 badges:{perseverant:['💪','Persévérant','Tu as continué jusqu’au bout.'],observer:['🔍','Observateur','Tu as trouvé du premier coup.'],detective:['🕵️','Petit détective','Tu as fini les 6 manches.']}},
ar:{title:'اعثر على الظل',sound:'الصوت',next:'التالي',again:'العب مرة أخرى',endT:'أحسنت، أيها المحقق الصغير!',tq:'أين ظله؟',
 hello:'انظر جيداً إلى الشكل، ثم المس ظله.',ok:['أحسنت!','لقد وجدته!','رائع، نظرة ذكية!'],
 retry:['ليس هذا. انظر جيداً إلى الشكل!','تقريباً! جرّب ظلاً آخر.','لنحاول معاً!'],hint:'انظر، هذا الظل يلمع!',levelDone:'نظرتك رائعة!',lvl:'الجولة',of:'من',
 badges:{perseverant:['💪','مثابر','واصلت حتى النهاية.'],observer:['🔍','مراقب ذكي','وجدته من أول مرة.'],detective:['🕵️','محقق صغير','أنهيت الجولات الست.']}}};
const $=id=>document.getElementById(id);
const S={lang:'fr',sound:true,level:1,r:null,errors:0,hints:0,found:false,wrongSet:new Set(),badges:new Set(),done:0};
try{const l=localStorage.getItem('omb-lang');if(l==='ar'||l==='fr')S.lang=l;}catch(e){}
const t=()=>T[S.lang],pick=a=>a[Math.floor(Math.random()*a.length)];
let VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function voiceFor(l){return VOICES.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(l));}
let remoteArabicAudio=null;
function say(text){if(!silentMsg)$('msg').textContent=text;const note=$('vnote');note.hidden=true;if(!S.sound)return;
try{
  if(S.lang==='ar'){
    if('speechSynthesis' in window)speechSynthesis.cancel();
    if(remoteArabicAudio){remoteArabicAudio.pause();remoteArabicAudio.currentTime=0;}
    const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&ttsspeed=0.85&q='+encodeURIComponent(text);
    remoteArabicAudio=new Audio(url);
    remoteArabicAudio.play().catch(()=>{fallbackArabicSpeech(text,note);});
    remoteArabicAudio.onerror=()=>fallbackArabicSpeech(text,note);
    return;
  }
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();loadVoices();const v=voiceFor('fr');
  const u=new SpeechSynthesisUtterance(text);if(v){u.voice=v;u.lang=v.lang;}else u.lang='fr-FR';u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u);
}catch(e){if(S.lang==='ar')fallbackArabicSpeech(text,note);}
}
function fallbackArabicSpeech(text,note){
  if(!('speechSynthesis' in window))return;
  try{loadVoices();const v=voiceFor('ar');if(!v){note.hidden=false;return;}
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=.9;u.pitch=1.1;speechSynthesis.speak(u);
  }catch(e){}
}
function applyLang(){const d=document.documentElement;d.lang=S.lang;d.dir=S.lang==='ar'?'rtl':'ltr';
$('title').textContent=t().title;$('snd').textContent=(S.sound?'🔊 ':'🔇 ')+t().sound;$('snd').setAttribute('aria-pressed',S.sound);
$('lang').textContent=S.lang==='fr'?'العربية':'Français';$('next').textContent=t().next;$('again').textContent=t().again;$('endT').textContent=t().endT;$('tq').textContent=t().tq;document.title=t().title;}
function renderDots(){$('dots').setAttribute('aria-label',`${t().lvl} ${S.level} ${t().of} ${TOTAL_LEVELS}`);
$('dots').innerHTML=Array.from({length:TOTAL_LEVELS},(_,i)=>`<span class="dot ${i+1<S.level?'done':i+1===S.level?'now':''}"></span>`).join('');}
function render(){$('tg').textContent=S.r.target;
$('choices').innerHTML=S.r.choices.map(e=>`<button class="sh ${S.found&&isRight(S.r,e)?'found':''} ${S.wrongSet.has(e)?'wrong':''}" data-e="${e}" aria-label="?" ${S.found?'disabled':''}><span>${e}</span></button>`).join('');}
function startLevel(n){S.level=n;S.r=buildRound(n);S.errors=0;S.hints=0;S.found=false;S.wrongSet=new Set();
$('next').hidden=true;$('end').hidden=true;$('game').hidden=false;renderDots();render();say(t().hello);}
$('choices').addEventListener('click',e=>{const b=e.target.closest('.sh');if(!b||S.found)return;const em=b.dataset.e;
if(isRight(S.r,em)){S.found=true;render();finish();}
else{S.errors++;S.wrongSet.add(em);render();const w=document.querySelector(`.sh[data-e="${em}"]`);if(w){w.classList.remove('wrong');void w.offsetWidth;w.classList.add('wrong');}
 if(needsHint(S.errors)){S.hints++;const g=document.querySelector(`.sh[data-e="${S.r.target}"]`);if(g)g.classList.add('hint');say(t().hint);}else say(pick(t().retry));}});
function finish(){S.done=Math.max(S.done,S.level);badgesFor(S).forEach(b=>S.badges.add(b));
if(S.level>=TOTAL_LEVELS){finalBadges(S.done).forEach(b=>S.badges.add(b));say(pick(t().ok));setTimeout(showEnd,1500);return;}
say(pick(t().ok)+' '+t().levelDone);$('next').hidden=false;$('next').focus();}
function showEnd(){$('game').hidden=true;$('end').hidden=false;
$('badges').innerHTML=[...S.badges].map(k=>{const b=t().badges[k];return `<li class="badge"><b>${b[0]}</b>${b[1]}<small>${b[2]}</small></li>`;}).join('');say(t().endT);}
$('next').addEventListener('click',()=>startLevel(S.level+1));
$('again').addEventListener('click',()=>{S.badges=new Set();S.done=0;startLevel(1);});
$('snd').addEventListener('click',()=>{S.sound=!S.sound;if(!S.sound&&'speechSynthesis' in window)speechSynthesis.cancel();applyLang();});
$('lang').addEventListener('click',()=>{S.lang=S.lang==='fr'?'ar':'fr';try{localStorage.setItem('omb-lang',S.lang);}catch(e){}applyLang();if(!$('end').hidden)showEnd();else{renderDots();render();say(t().hello);}});
applyLang();startLevel(1);
</script>
</body>
</html>
