<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les lettres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f3fa;--tint:#b5e6f2;--ink:#12343b;--soft:#4c7680;--leaf:#2f8f55;--card:#ffffff;--sun:#ffc83d;--ring:#12343b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f2a30;--tint:#17414a;--ink:#e6f9fd;--soft:#a3ccd5;--leaf:#5fcf88;--card:#1a3f48;--sun:#ffd25e;--ring:#e6f9fd}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f2a30;--tint:#17414a;--ink:#e6f9fd;--soft:#a3ccd5;--leaf:#5fcf88;--card:#1a3f48;--sun:#ffd25e;--ring:#e6f9fd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka','Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
[dir=rtl] body,[dir=rtl] button{font-family:'Cairo','Fredoka',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ring);outline-offset:3px}
.app{max-width:620px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:700;line-height:1.1}
.tools{display:flex;gap:8px}
.tool{min-width:48px;height:48px;border-radius:16px;border:3px solid var(--ink);background:var(--card);font-weight:600;font-size:1.05rem;padding:0 12px}
a.tool.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem}
.dots{display:flex;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
.dot.done{background:var(--leaf)}.dot.now{background:var(--sun)}
.pic{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:14px;text-align:center}
.pic span{display:block;font-size:clamp(5rem,26vw,8rem);line-height:1.1}
.pic button{margin-top:6px;border:3px solid var(--ink);border-radius:18px;background:var(--tint);font-weight:700;font-size:1.6rem;padding:6px 22px;min-height:52px}
.q{margin:0;font-size:1.4rem;font-weight:700;text-align:center}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.let{width:clamp(80px,24vw,104px);height:clamp(80px,24vw,104px);border:4px solid var(--ink);border-radius:26px;background:var(--tint);font-size:3.4rem;font-weight:700;line-height:1;padding:0}
.let:active{transform:scale(.93)}
.let.good{background:var(--leaf);color:#fff;animation:pop .4s}
.let.wrong{animation:wob .4s;opacity:.5}
.let.hint{animation:pulse .8s 4;border-color:var(--sun);border-width:6px}
.msg{font-size:1.3rem;font-weight:600;text-align:center;min-height:2.2em;margin:0}
.big{display:block;margin:0 auto;border:4px solid var(--ink);border-radius:22px;background:var(--sun);color:#12343b;font-weight:700;font-size:1.4rem;padding:14px 32px;min-height:60px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:18px;text-align:center}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 0;padding:0;list-style:none}
.badge{background:var(--tint);border-radius:18px;padding:10px 14px;font-weight:600}
.badge b{display:block;font-size:2rem}.badge small{display:block;color:var(--soft);font-weight:400}
[hidden]{display:none!important}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes wob{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title"></h1><div class="tools"><a class="tool home" href="menu-accueil.html" aria-label="Accueil / الصفحة الرئيسية" title="Accueil / الصفحة الرئيسية">⌂</a><button class="tool" id="snd" aria-pressed="true"></button><button class="tool" id="lang"></button></div></header>
  <div class="dots" id="dots" role="img"></div>
  <main id="game" style="display:flex;flex-direction:column;gap:14px">
    <div class="pic"><span id="em" aria-hidden="true"></span><button id="wd"></button></div>
    <p class="q" id="q"></p>
    <div class="choices" id="choices"></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p id="vnote" hidden style="margin:0;text-align:center;font-size:1rem;color:var(--soft)">تعذّر تحميل الصوت العربي. Vérifie ta connexion Internet puis réessaie.</p>
    <button class="big" id="next" hidden></button>
  </main>
  <section class="panel" id="end" hidden><h2 id="endT"></h2><ul class="badges" id="badges"></ul><button class="big" id="again" style="margin-top:16px"></button></section>
</div>
<script>
// LOGIC-START
// [emoji, mot FR, lettre FR, mot AR, lettre AR]
const WORDS=[['🍎','pomme','P','تفاحة','ت'],['🌙','lune','L','قمر','ق'],['🏠','maison','M','بيت','ب'],['🚗','voiture','V','سيارة','س'],
['🍌','banane','B','موز','م'],['☀️','soleil','S','شمس','ش'],['🌹','rose','R','وردة','و'],['🥛','lait','L','حليب','ح']];
const FR='ABCDEFGHIJKLMNOPQRSTUV'.split(''),AR='ابتثجحخدرزسشصعفقكلمنوي'.split('');
const CHOICES=[2,2,3,3,4,4],TOTAL_LEVELS=CHOICES.length;
function shuffle(a,rng){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function buildDeck(rng){return shuffle(WORDS.map((_,i)=>i),rng||Math.random).slice(0,TOTAL_LEVELS);}
function buildRound(n,lang,wi,rng){rng=rng||Math.random;const w=WORDS[wi],ar=lang==='ar',letter=ar?w[4]:w[2],pool=ar?AR:FR;
const others=shuffle(pool.filter(l=>l!==letter),rng).slice(0,CHOICES[n-1]-1);
return{emoji:w[0],word:ar?w[3]:w[1],letter,choices:shuffle([letter].concat(others),rng)};}
function isRight(r,l){return r.letter===l;}
function needsHint(e){return e>=2;}
function badgesFor(s){const b=[];if(s.errors>=3)b.push('perseverant');if(s.errors===0)b.push('observer');return b;}
function finalBadges(done){return done>=TOTAL_LEVELS?['letters']:[];}
// LOGIC-END
const T={
fr:{title:'Les lettres',sound:'Son',next:'Suite',again:'Rejouer',endT:'Bravo, tu connais bien les lettres !',q:'Par quelle lettre commence ce mot ?',
 hello:'Regarde l’image, écoute le mot, puis touche la première lettre.',ok:(l,w)=>`${l} comme ${w}. Bravo !`,
 retry:['Pas cette lettre. Écoute bien le début du mot !','Presque ! Essaie une autre lettre.','On réessaie ensemble !'],hint:'Regarde, cette lettre brille !',levelDone:'Tu es formidable !',lvl:'Manche',of:'sur',
 badges:{perseverant:['💪','Persévérant','Tu as continué jusqu’au bout.'],observer:['🔍','Observateur','Tu as trouvé du premier coup.'],letters:['🔤','Ami des lettres','Tu as fini les 6 manches.']}},
ar:{title:'الحروف',sound:'الصوت',next:'التالي',again:'العب مرة أخرى',endT:'أحسنت، تعرف الحروف جيداً!',q:'بأي حرف تبدأ هذه الكلمة؟',
 hello:'انظر إلى الصورة، واستمع إلى الكلمة، ثم المس الحرف الأول.',ok:(l,w)=>`${w} تبدأ بحرف ${l}. أحسنت!`,
 retry:['ليس هذا الحرف. استمع جيداً إلى بداية الكلمة!','تقريباً! جرّب حرفاً آخر.','لنحاول معاً!'],hint:'انظر، هذا الحرف يلمع!',levelDone:'أنت رائع!',lvl:'الجولة',of:'من',
 badges:{perseverant:['💪','مثابر','واصلت حتى النهاية.'],observer:['🔍','مراقب ذكي','وجدته من أول مرة.'],letters:['🔤','صديق الحروف','أنهيت الجولات الست.']}}};
const $=id=>document.getElementById(id);
const S={lang:'fr',sound:true,level:1,deck:buildDeck(),r:null,errors:0,hints:0,found:false,wrongSet:new Set(),badges:new Set(),done:0};
try{const l=localStorage.getItem('let-lang');if(l==='ar'||l==='fr')S.lang=l;}catch(e){}
const t=()=>T[S.lang],pick=a=>a[Math.floor(Math.random()*a.length)];
let VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function voiceFor(l){return VOICES.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(l));}
let arabicTtsPromise=null;
let arabicTtsReady=null;
async function sayArabicOnline(text){
  if(!arabicTtsReady){
    if(!arabicTtsPromise){
      arabicTtsPromise=import('https://cdn.jsdelivr.net/npm/nabra-tts@0/+esm')
        .then(({NabraTTS})=>NabraTTS.load({dtype:'fp16'}))
        .then(tts=>{arabicTtsReady=tts;return tts;})
        .catch(error=>{arabicTtsPromise=null;throw error;});
    }
    await arabicTtsPromise;
    return false;
  }
  await arabicTtsReady.speak(text);
  return true;
}
async function say(text,silentMsg){
  if(typeof silentMsg==='undefined'||!silentMsg)$('msg').textContent=text;
  const note=$('vnote');note.hidden=true;
  if(!S.sound)return;
  if(S.lang==='ar'){
    if('speechSynthesis' in window)speechSynthesis.cancel();
    try{
      note.textContent='جارٍ تحميل الصوت العربي لأول مرة… Chargement initial de la voix arabe…';
      note.hidden=false;
      const spoke=await sayArabicOnline(text);
      if(spoke){note.hidden=true;}
      else{
        note.textContent='تم تجهيز الصوت العربي. اضغط على شكل أو زر داخل اللعبة لسماع الصوت. Voix arabe prête : clique sur un élément du jeu pour écouter.';
        note.hidden=false;
      }
    }catch(e){
      note.textContent='تعذّر تحميل الصوت العربي. Vérifie ta connexion Internet puis réessaie.';
      note.hidden=false;
      console.warn('Arabic browser TTS failed:',e);
    }
    return;
  }
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();loadVoices();const v=voiceFor('fr');
    const u=new SpeechSynthesisUtterance(text);if(v){u.voice=v;u.lang=v.lang;}else u.lang='fr-FR';u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u);
  }catch(e){}
}
function applyLang(){const d=document.documentElement;d.lang=S.lang;d.dir=S.lang==='ar'?'rtl':'ltr';
$('title').textContent=t().title;$('snd').textContent=(S.sound?'🔊 ':'🔇 ')+t().sound;$('snd').setAttribute('aria-pressed',S.sound);
$('lang').textContent=S.lang==='fr'?'العربية':'Français';$('next').textContent=t().next;$('again').textContent=t().again;$('endT').textContent=t().endT;$('q').textContent=t().q;document.title=t().title;}
function renderDots(){$('dots').setAttribute('aria-label',`${t().lvl} ${S.level} ${t().of} ${TOTAL_LEVELS}`);
$('dots').innerHTML=Array.from({length:TOTAL_LEVELS},(_,i)=>`<span class="dot ${i+1<S.level?'done':i+1===S.level?'now':''}"></span>`).join('');}
function render(){const r=S.r;$('em').textContent=r.emoji;$('wd').textContent='🔊 '+r.word;
$('choices').innerHTML=r.choices.map(l=>`<button class="let ${S.found&&isRight(r,l)?'good':''} ${S.wrongSet.has(l)?'wrong':''}" data-l="${l}" aria-label="${l}" ${S.found?'disabled':''}>${l}</button>`).join('');}
function newRound(){S.r=buildRound(S.level,S.lang,S.deck[S.level-1]);S.errors=0;S.hints=0;S.found=false;S.wrongSet=new Set();}
function startLevel(n){S.level=n;newRound();$('next').hidden=true;$('end').hidden=true;$('game').hidden=false;renderDots();render();say(S.r.word+'. '+t().hello);$('msg').textContent=t().hello;}
$('wd').addEventListener('click',()=>say(S.r.word,true));
$('choices').addEventListener('click',e=>{const b=e.target.closest('.let');if(!b||S.found)return;const l=b.dataset.l;
if(isRight(S.r,l)){S.found=true;render();finish();}
else{S.errors++;S.wrongSet.add(l);render();
 if(needsHint(S.errors)){S.hints++;const g=document.querySelector(`.let[data-l="${S.r.letter}"]`);if(g)g.classList.add('hint');say(t().hint);}else say(pick(t().retry));}});
function finish(){S.done=Math.max(S.done,S.level);badgesFor(S).forEach(b=>S.badges.add(b));const m=t().ok(S.r.letter,S.r.word);
if(S.level>=TOTAL_LEVELS){finalBadges(S.done).forEach(b=>S.badges.add(b));say(m);setTimeout(showEnd,1800);return;}
say(m);$('next').hidden=false;$('next').focus();}
function showEnd(){$('game').hidden=true;$('end').hidden=false;
$('badges').innerHTML=[...S.badges].map(k=>{const b=t().badges[k];return `<li class="badge"><b>${b[0]}</b>${b[1]}<small>${b[2]}</small></li>`;}).join('');say(t().endT);}
$('next').addEventListener('click',()=>startLevel(S.level+1));
$('again').addEventListener('click',()=>{S.badges=new Set();S.done=0;S.deck=buildDeck();startLevel(1);});
$('snd').addEventListener('click',()=>{S.sound=!S.sound;if(!S.sound&&'speechSynthesis' in window)speechSynthesis.cancel();applyLang();});
$('lang').addEventListener('click',()=>{S.lang=S.lang==='fr'?'ar':'fr';try{localStorage.setItem('let-lang',S.lang);}catch(e){}applyLang();if(!$('end').hidden)showEnd();else{newRound();$('next').hidden=true;renderDots();render();say(S.r.word+'. '+t().hello);$('msg').textContent=t().hello;}});
applyLang();startLevel(1);
</script>
</body>
</html>
