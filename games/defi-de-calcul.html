<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4dc"><title>Défi de calcul — Wael Game Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4dc;--ink:#2a2038;--card:#fff;--sun:#ffc83d;--soft:#665a7c;--green:#2f8f55}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff4dc,#dff3ff);color:var(--ink);font-family:Fredoka,Cairo,system-ui,sans-serif;min-height:100vh}[dir=rtl] body,[dir=rtl] button{font-family:Cairo,Fredoka,system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:16px;display:grid;gap:16px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:clamp(1.5rem,5vw,2.3rem);margin:0}.tools{display:flex;gap:8px}button,.home{font:inherit;color:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:16px;background:var(--card);min-height:48px;padding:8px 14px;font-weight:700}.home{text-decoration:none;display:inline-flex;align-items:center}.hero,.board,.feedback{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:18px;text-align:center}.hero p{font-size:1.2rem;margin:6px}.board{display:grid;gap:12px}.question{font-size:clamp(1.4rem,5vw,2rem);font-weight:700;margin:0}.options{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.option{min-width:84px;min-height:84px;font-size:2rem;background:#dff3ff}.option:focus-visible{outline:4px solid #8b6ff0}.option.correct{background:#bfe8c8}.option.wrong{background:#ffd2cc}.feedback{font-size:1.2rem;min-height:60px;display:grid;place-items:center}.primary{background:var(--sun);font-size:1.2rem}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{aspect-ratio:1;min-width:0;min-height:65px;font-size:clamp(1.5rem,7vw,2.6rem);padding:4px;background:#dff3ff}.tile.flipped{background:#ffe4a1}.tile.matched{background:#bfe8c8}.tile:disabled{cursor:default}.stats{font-weight:700;text-align:center}.note{font-size:.95rem;color:var(--soft);text-align:center;margin:0}[hidden]{display:none!important}@media(max-width:440px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{min-height:54px;padding:2px}}
</style></head><body><main class="app"><header><h1 id="title">Défi de calcul</h1><div class="tools"><a class="home" href="menu-accueil.html">⌂ <span id="homeLabel">Accueil</span></a><button id="sound" aria-pressed="true">🔊 Son</button><button id="lang">العربية</button></div></header><section class="hero"><p id="subtitle">Résous de petits calculs et gagne des étoiles.</p><p id="instructions"></p></section><section class="board"><p class="question" id="question"></p><div id="options" class="options"></div><div id="memory" class="grid" hidden></div><p id="stats" class="stats"></p><button id="next" class="primary" hidden></button><button id="restart" hidden></button></section><p id="feedback" class="feedback" role="status" aria-live="polite"></p><p class="note" id="voiceNote" hidden></p></main>
<script>
const KIND="math";
const TXT={
fr:{title:"Défi de calcul",subtitle:"Résous de petits calculs et gagne des étoiles.",home:'Accueil',sound:'🔊 Son',mute:'🔇 Son',start:'Commencer',next:'Question suivante',again:'Rejouer',correct:['Bravo ! 🌟','Très bien ! 🎉','Super, continue ! 🥳'],wrong:['Essaie encore, tu peux y arriver ! 💪','Pas tout à fait. Réessaie ! 🌈'],finish:'Bravo ! Tu as terminé le jeu ! 🏆',listen:'Écoute la consigne : ',questionLetters:'Quelle lettre entends-tu au début du mot ?',questionMath:'Combien font ',questionMemory:'Retrouve toutes les paires !',questionEco:'Où faut-il jeter cet objet ?',stats:'Points : ',hint:'Appuie sur le bouton pour entendre la consigne.',items:['pomme','soleil','lune','maison','voiture','banane'],bins:['Recyclage ♻️','Compost 🌱','Déchets 🗑️'],objects:['🧴','🍌','📰','🥫','🍎','📦'],letterWords:[['🍎','تفاحة','ت','pomme','P'],['🌙','قمر','ق','lune','L'],['🏠','بيت','ب','maison','M'],['☀️','شمس','ش','soleil','S'],['🚗','سيارة','س','voiture','V'],['🌹','وردة','و','rose','R']]},
ar:{title:"تحدّي الحساب",subtitle:"حلّ عمليات حسابية بسيطة واجمع النجوم.",home:'الرئيسية',sound:'🔊 الصوت',mute:'🔇 الصوت',start:'ابدأ',next:'السؤال التالي',again:'العب من جديد',correct:['أحسنت! 🌟','رائع! 🎉','ممتاز، واصل! 🥳'],wrong:['حاول مرة أخرى، تستطيع! 💪','ليس تماماً، جرّب من جديد! 🌈'],finish:'أحسنت! لقد أكملت اللعبة! 🏆',listen:'استمع إلى التعليمات: ',questionLetters:'ما الحرف الأول من الكلمة؟',questionMath:'كم يساوي ',questionMemory:'اعثر على كل الأزواج المتشابهة!',questionEco:'أين نضع هذا الشيء؟',stats:'النقاط: ',hint:'اضغط على الزر لسماع التعليمات.',items:['تفاحة','شمس','قمر','بيت','سيارة','موز'],bins:['إعادة التدوير ♻️','السماد 🌱','النفايات 🗑️'],objects:['🧴','🍌','📰','🥫','🍎','📦'],letterWords:[['🍎','تفاحة','ت','pomme','P'],['🌙','قمر','ق','lune','L'],['🏠','بيت','ب','maison','M'],['☀️','شمس','ش','soleil','S'],['🚗','سيارة','س','voiture','V'],['🌹','وردة','و','rose','R']]}}
let lang='fr',sound=true,score=0,round=0,deck=[],matches=0,first=null,lock=false;
const $=id=>document.getElementById(id),t=()=>TXT[lang],pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function say(text){$('voiceNote').hidden=true;if(!sound)return;
try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='ar'?'ar':'fr-FR';u.rate=.86;const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang.toLowerCase().startsWith(lang==='ar'?'ar':'fr'));if(v)u.voice=v;speechSynthesis.speak(u);return;}}catch(e){}
$('voiceNote').textContent=t().hint;$('voiceNote').hidden=false;}
function message(ok){$('feedback').textContent=ok?pick(t().correct):pick(t().wrong);if(ok)say($('feedback').textContent)}
function setLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('title').textContent=t().title;$('subtitle').textContent=t().subtitle;$('homeLabel').textContent=t().home;$('sound').textContent=sound?t().sound:t().mute;$('sound').setAttribute('aria-pressed',sound);$('lang').textContent=lang==='fr'?'العربية':'Français';$('restart').textContent=t().again;$('next').textContent=t().next;render()}
function begin(){score=0;round=0;matches=0;first=null;lock=false;$('feedback').textContent='';$('restart').hidden=true;$('next').hidden=true;render()}
function render(){if(KIND==='memory'){renderMemory();return}if(KIND==='eco'){renderEco();return}if(KIND==='letters'){renderLetters();return}renderMath()}
function buttons(items,handler){$('options').innerHTML='';$('options').hidden=false;$('memory').hidden=true;items.forEach((it,i)=>{const b=document.createElement('button');b.className='option';b.textContent=it.label;b.setAttribute('aria-label',it.label);b.addEventListener('click',()=>handler(it,i,b));$('options').appendChild(b)})}
function renderLetters(){const words=t().letterWords;const w=words[round%words.length];$('question').textContent=t().questionLetters+' '+w[0];$('stats').textContent=t().stats+score+' · '+(round+1)+'/6';say(lang==='ar'?w[1]:w[3]);const correct=lang==='ar'?w[2]:w[4];const letters=shuffle([correct,...shuffle((lang==='ar'?'ابتثجحخدذرسزسشصعفقكلمنهوي':'ABCDEFGHLMPRSV').split('').filter(x=>x!==correct)).slice(0,3)]);buttons(letters.map(label=>({label})),(it,i,b)=>{if(it.label===correct){score++;round++;message(true);if(round>=6)finish();else $('next').hidden=false;b.classList.add('correct')}else{b.classList.add('wrong');message(false)}})}
function renderMath(){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9),ans=a+b;deck=[ans,Math.max(0,ans-1),ans+1,Math.max(0,ans-2)];$('question').textContent=t().questionMath+(lang==='ar'?a+' + '+b:a+' + '+b)+' = ؟';$('stats').textContent=t().stats+score+' · '+(round+1)+'/8';buttons(shuffle([...new Set(deck)]).slice(0,4).map(label=>({label:String(label)})),(it,i,el)=>{if(Number(it.label)===ans){score++;round++;message(true);if(round>=8)finish();else $('next').hidden=false;el.classList.add('correct')}else{el.classList.add('wrong');message(false)}})}
function renderMemory(){ $('options').hidden=true;$('memory').hidden=false;$('question').textContent=t().questionMemory;$('stats').textContent=t().stats+score+' · '+matches+'/6';if(!deck.length){deck=shuffle([...t().objects.slice(0,6),...t().objects.slice(0,6)].map((emoji,i)=>({emoji,id:i%6,uid:i})));}const grid=$('memory');grid.innerHTML='';deck.forEach((card,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=card.found||card.open?card.emoji:'❔';b.disabled=!!card.found||lock;b.setAttribute('aria-label',card.found?card.emoji:(lang==='ar'?'بطاقة مخفية':'Carte cachée'));if(card.open)b.classList.add('flipped');if(card.found)b.classList.add('matched');b.onclick=()=>flip(i);grid.appendChild(b)})}
function flip(i){if(lock||deck[i].found||deck[i].open)return;deck[i].open=true;renderMemory();if(first===null){first=i;return}const a=deck[first],b=deck[i];if(a.id===b.id&&a.uid!==b.uid){a.found=b.found=true;matches++;score+=2;first=null;message(true);renderMemory();if(matches===6)finish()}else{lock=true;setTimeout(()=>{a.open=b.open=false;first=null;lock=false;renderMemory()},650)}}
function renderEco(){const item=t().objects[round%t().objects.length];$('question').textContent=t().questionEco+' '+item;$('stats').textContent=t().stats+score+' · '+(round+1)+'/6';const labels=lang==='ar'?['إعادة التدوير ♻️','السماد 🌱','النفايات 🗑️']:['Recyclage ♻️','Compost 🌱','Déchets 🗑️'];const correct=([0,1,0,0,1,0])[round%6];buttons(labels.map((label,i)=>({label,i})),(it,i,b)=>{if(it.i===correct){score++;round++;message(true);if(round>=6)finish();else $('next').hidden=false;b.classList.add('correct')}else{b.classList.add('wrong');message(false)}})}
function finish(){$('next').hidden=true;$('restart').hidden=false;$('question').textContent=t().finish;$('options').innerHTML='';$('options').hidden=true;$('memory').hidden=true;$('stats').textContent=t().stats+score;say(t().finish)}
$('next').onclick=()=>{$('next').hidden=true;$('feedback').textContent='';if(KIND==='memory')return;render()};$('restart').onclick=begin;
$('lang').onclick=()=>{lang=lang==='fr'?'ar':'fr';setLang()};$('sound').onclick=()=>{sound=!sound;setLang();if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};
setLang();begin();
</script></body></html>
