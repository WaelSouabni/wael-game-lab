<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jardin des formes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e2f4f1;--sky:#c7ebe6;--ink:#33274a;--soft:#6a5d82;--leaf:#2f8f55;--soil:#9a6a47;--card:#ffffff;--sun:#ffc83d;--ring:#33274a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12262a;--sky:#183338;--ink:#f3eefc;--soft:#b9b0cf;--leaf:#5fcf88;--soil:#c58d66;--card:#1f3a40;--sun:#ffd25e;--ring:#f3eefc}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12262a;--sky:#183338;--ink:#f3eefc;--soft:#b9b0cf;--leaf:#5fcf88;--soil:#c58d66;--card:#1f3a40;--sun:#ffd25e;--ring:#f3eefc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka','Cairo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
[dir=rtl] body,[dir=rtl] button{font-family:'Cairo','Fredoka',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ring);outline-offset:3px}
.app{max-width:760px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.1rem);font-weight:700;line-height:1.1}
.tools{display:flex;gap:8px}
.tool{min-width:48px;height:48px;border-radius:16px;border:3px solid var(--ink);background:var(--card);font-weight:600;font-size:1.05rem;padding:0 12px}
a.tool.home{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.5rem}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:transparent}
.dot.done{background:var(--leaf)}.dot.now{background:var(--sun)}
.bed{background:var(--sky);border-radius:28px;padding:18px 12px 0;position:relative;overflow:hidden}
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;padding-bottom:16px}
.slot{aspect-ratio:1;border-radius:24px;border:4px dashed var(--soil);background:color-mix(in srgb,var(--card) 70%,transparent);display:grid;place-items:center;padding:10px}
.slot.full{border-style:solid;border-color:var(--leaf);animation:pop .4s}
.slot.hint{animation:pulse .8s 3;border-color:var(--sun)}
.slot.wrong{animation:wob .4s}
.slot svg{width:100%;height:100%}
.grass{height:26px;margin:0 -12px;background:var(--leaf);border-radius:50% 50% 0 0/100% 100% 0 0}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));align-content:start;gap:12px;background:var(--card);border-radius:28px;padding:14px;min-height:118px;border:3px solid var(--ink)}
.item{aspect-ratio:1;border:0;background:transparent;padding:8px;border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.item svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.item.sel{outline:4px solid var(--sun);background:color-mix(in srgb,var(--sun) 25%,transparent)}
.item.drag{z-index:5;transition:none;position:relative}
.msg{font-size:1.35rem;font-weight:600;text-align:center;min-height:2.2em;margin:0}
.big{display:block;margin:0 auto;border:4px solid var(--ink);border-radius:22px;background:var(--sun);color:#33274a;font-weight:700;font-size:1.4rem;padding:14px 32px;min-height:60px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:18px;text-align:center}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 0;padding:0;list-style:none}
.badge{background:var(--sky);border-radius:18px;padding:10px 14px;font-weight:600}
.badge b{display:block;font-size:2rem}
.badge small{display:block;color:var(--soft);font-weight:400}
[hidden]{display:none!important}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes wob{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 0 8px color-mix(in srgb,var(--sun) 55%,transparent)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <div class="tools"><a class="tool home" href="menu-accueil.html" aria-label="Accueil / الصفحة الرئيسية" title="Accueil / الصفحة الرئيسية">⌂</a>
      <button class="tool" id="snd" aria-pressed="true"></button>
      <button class="tool" id="lang"></button>
    </div>
  </header>
  <div class="dots" id="dots" role="img"></div>
  <main id="game">
    <div class="bed"><div class="pots" id="pots"></div><div class="grass"></div></div>
    <div class="tray" id="tray" style="margin-top:14px"></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p id="vnote" hidden style="margin:0;text-align:center;font-size:1rem;color:var(--soft)">تعذّر تحميل الصوت العربي. Vérifie ta connexion Internet puis réessaie.</p>
    <button class="big" id="next" hidden></button>
  </main>
  <section class="panel" id="end" hidden>
    <h2 id="endT"></h2>
    <ul class="badges" id="badges"></ul>
    <button class="big" id="again" style="margin-top:16px"></button>
  </section>
</div>
<script>
// LOGIC-START
const SHAPES=['circle','square','triangle','star','heart'];
const COLORS=['#ef5f67','#f5a623','#2bb3c0','#5cb85c','#a56bd1','#ee7fb5'];
const TOTAL_LEVELS=5;
function shuffle(a,rng){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function buildLevel(n,rng){rng=rng||Math.random;const count=Math.min(n+1,6);const shapes=shuffle(SHAPES,rng);const colors=shuffle(COLORS,rng);
const items=[];for(let i=0;i<count;i++)items.push({id:i,shape:shapes[i%shapes.length],color:colors[i]});
return{items:shuffle(items,rng),slots:shuffle(items,rng)};}
function isMatch(item,slot){return item.id===slot.id;}
function needsHint(errorsOnItem){return errorsOnItem>=2;}
function badgesFor(s){const b=[];if(s.errors>=3)b.push('perseverant');if(s.errors===0&&s.hints===0)b.push('observer');return b;}
function finalBadges(done){return done>=TOTAL_LEVELS?['gardener']:[];}
// LOGIC-END

const T={
fr:{title:'Le jardin des formes',sound:'Son',next:'Suite',again:'Rejouer',endT:'Bravo, ton jardin est magnifique !',
 hello:'Choisis une forme et mets-la dans son pot.',
 ok:['Bravo !','Super !','Bien joué !','Tu as trouvé !'],
 retry:['Essaie un autre pot, tu y es presque !','Pas ce pot-là. Regarde bien la forme.','On réessaie ensemble !'],
 hint:'Regarde, le pot brille !',levelDone:'Niveau terminé, tu es formidable !',
 lvl:'Niveau',of:'sur',
 badges:{perseverant:['💪','Persévérant','Tu as continué jusqu’au bout.'],observer:['🔍','Observateur','Tu as tout trouvé du premier coup.'],gardener:['🌻','Jardinier','Tu as fini les 5 niveaux.']}},
ar:{title:'حديقة الأشكال',sound:'الصوت',next:'التالي',again:'العب مرة أخرى',endT:'أحسنت، حديقتك رائعة!',
 hello:'اختر شكلاً وضعه في الوعاء المناسب.',
 ok:['أحسنت!','رائع!','ممتاز!','لقد وجدته!'],
 retry:['جرّب وعاءً آخر، أنت قريب جداً!','ليس هذا الوعاء. انظر جيداً إلى الشكل.','لنحاول معاً!'],
 hint:'انظر، الوعاء يلمع!',levelDone:'انتهى المستوى، أنت رائع!',
 lvl:'المستوى',of:'من',
 badges:{perseverant:['💪','مثابر','واصلت حتى النهاية.'],observer:['🔍','مراقب ذكي','وجدت كل شيء من أول مرة.'],gardener:['🌻','بستاني','أنهيت المستويات الخمسة.']}}
};
const PATHS={circle:'<circle cx="50" cy="50" r="42"/>',square:'<rect x="9" y="9" width="82" height="82" rx="14"/>',
triangle:'<polygon points="50,8 94,88 6,88" stroke-linejoin="round"/>',
star:'<polygon points="50,6 62,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 38,38" stroke-linejoin="round"/>',
heart:'<path d="M50 88C14 62 6 40 18 24c10-12 25-8 32 4 7-12 22-16 32-4 12 16 4 38-32 64z"/>'};
const NAMES={fr:{circle:'rond',square:'carré',triangle:'triangle',star:'étoile',heart:'cœur'},ar:{circle:'دائرة',square:'مربع',triangle:'مثلث',star:'نجمة',heart:'قلب'}};
const $=id=>document.getElementById(id);
const S={lang:'fr',sound:true,level:1,items:[],slots:[],placed:new Set(),errors:0,hints:0,errItem:{},sel:null,badges:new Set(),done:0};
try{const l=localStorage.getItem('jdf-lang');if(l==='ar'||l==='fr')S.lang=l;}catch(e){}
const t=()=>T[S.lang];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function svg(shape,color,filled){return `<svg viewBox="0 0 100 100" aria-hidden="true" fill="${filled?color:'none'}" stroke="${filled?'rgba(0,0,0,.25)':color}" stroke-width="${filled?3:5}" ${filled?'':'stroke-dasharray="9 7" opacity=".85"'}>${PATHS[shape]}</svg>`;}
let VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[];}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function voiceFor(l){return VOICES.find(v=>v.lang.toLowerCase().replace('_','-').startsWith(l));}
async function sayArabicNative(text){
  if(!('speechSynthesis' in window))return false;
  try{
    loadVoices();
    const voice=voiceFor('ar');
    if(!voice)return false;
    speechSynthesis.cancel();
    return await new Promise(resolve=>{
      const utterance=new SpeechSynthesisUtterance(text);
      utterance.voice=voice;
      utterance.lang=voice.lang||'ar';
      utterance.rate=.88;
      let finished=false;
      const done=value=>{if(finished)return;finished=true;resolve(value);};
      utterance.onend=()=>done(true);
      utterance.onerror=()=>done(false);
      speechSynthesis.speak(utterance);
    });
  }catch(error){return false;}
}
let voiceRequestId=0, activeTtsController=null, activeTtsAudio=null;
function stopCurrentVoice(){
  if(activeTtsController){activeTtsController.abort();activeTtsController=null;}
  if(activeTtsAudio){try{activeTtsAudio.pause();activeTtsAudio.currentTime=0;}catch(e){}activeTtsAudio=null;}
  if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}
}
async function sayArabicOnline(text,requestId){
  const chunks=[];let remaining=String(text).trim();
  while(remaining.length>300){let cut=remaining.lastIndexOf(' ',300);if(cut<120)cut=300;chunks.push(remaining.slice(0,cut));remaining=remaining.slice(cut).trim();}
  if(remaining)chunks.push(remaining);
  for(const chunk of chunks){
    if(requestId!==voiceRequestId)return false;
    const controller=new AbortController();activeTtsController=controller;
    let response;
    try{response=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:chunk}),signal:controller.signal});}
    catch(error){if(requestId!==voiceRequestId)return false;if(await sayArabicNative(chunk))continue;throw error;}
    finally{if(activeTtsController===controller)activeTtsController=null;}
    if(requestId!==voiceRequestId)return false;
    if(!response.ok){if(await sayArabicNative(chunk))continue;let code='tts_provider_failed';try{code=(await response.json()).error||code;}catch(e){}const error=new Error(code);error.code=code;throw error;}
    const blob=await response.blob();if(requestId!==voiceRequestId)return false;if(!blob.size)throw new Error('empty_audio');
    const audioUrl=URL.createObjectURL(blob),audio=new Audio(audioUrl);audio.preload='auto';activeTtsAudio=audio;
    try{await new Promise((resolve,reject)=>{audio.addEventListener('ended',resolve,{once:true});audio.addEventListener('error',()=>reject(new Error('audio_decode_failed')),{once:true});audio.play().catch(reject);});}
    finally{if(activeTtsAudio===audio)activeTtsAudio=null;URL.revokeObjectURL(audioUrl);}
    if(requestId!==voiceRequestId)return false;
  }
  return true;
}
async function say(text,silentMsg){
  const requestId=++voiceRequestId;stopCurrentVoice();
  if(typeof silentMsg==='undefined'||!silentMsg)$('msg').textContent=text;
  const note=$('vnote');note.hidden=true;
  if(!S.sound)return;
  if(S.lang==='ar'){
    try{
      const spoke=await sayArabicOnline(text,requestId);
      if(requestId!==voiceRequestId)return;
      if(spoke)note.hidden=true;
      else{note.textContent='تم تجهيز الصوت العربي. اضغط على شكل أو زر داخل اللعبة لسماع الصوت. Voix arabe prête : clique sur un élément du jeu pour écouter.';note.hidden=false;}
    }catch(e){
      if(requestId!==voiceRequestId)return;
      if(e&&(e.name==='NotAllowedError'||/user gesture|not allowed|play\(\) failed/i.test(String(e.message||''))))note.textContent='اضغط على زر داخل اللعبة لسماع الصوت العربي. Appuie sur un bouton du jeu pour activer la voix arabe.';
      else if(e&&e.code==='tts_not_configured')note.textContent='الصوت العربي يحتاج إعداد الخدمة على الموقع. La clé du service vocal doit être configurée sur Vercel.';
      else note.textContent='تعذّر تشغيل الصوت العربي. Vérifie la configuration du service vocal puis réessaie.';
      note.hidden=false;console.warn('Arabic online TTS failed:',e);
    }
    return;
  }
  if(!('speechSynthesis' in window))return;
  try{loadVoices();const v=voiceFor('fr');const u=new SpeechSynthesisUtterance(text);if(v){u.voice=v;u.lang=v.lang;}else u.lang='fr-FR';u.rate=.9;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}
}
function applyLang(){const d=document.documentElement;d.lang=S.lang;d.dir=S.lang==='ar'?'rtl':'ltr';
$('title').textContent=t().title;$('snd').textContent=(S.sound?'🔊 ':'🔇 ')+t().sound;$('snd').setAttribute('aria-pressed',S.sound);
$('lang').textContent=S.lang==='fr'?'العربية':'Français';$('next').textContent=t().next;$('again').textContent=t().again;$('endT').textContent=t().endT;document.title=t().title;}
function renderDots(){$('dots').setAttribute('aria-label',`${t().lvl} ${S.level} ${t().of} ${TOTAL_LEVELS}`);
$('dots').innerHTML=Array.from({length:TOTAL_LEVELS},(_,i)=>`<span class="dot ${i+1<S.level?'done':i+1===S.level?'now':''}"></span>`).join('');}
function render(){
$('pots').innerHTML=S.slots.map(s=>{const full=S.placed.has(s.id);
return `<button class="slot ${full?'full':''}" data-id="${s.id}" aria-label="${NAMES[S.lang][s.shape]}" ${full?'disabled':''}>${svg(s.shape,s.color,full)}</button>`;}).join('');
$('tray').innerHTML=S.items.filter(i=>!S.placed.has(i.id)).map(i=>
`<button class="item ${S.sel===i.id?'sel':''}" data-id="${i.id}" aria-label="${NAMES[S.lang][i.shape]}">${svg(i.shape,i.color,true)}</button>`).join('');}
function startLevel(n){S.level=n;const L=buildLevel(n);S.items=L.items;S.slots=L.slots;S.placed=new Set();S.errors=0;S.hints=0;S.errItem={};S.sel=null;
$('next').hidden=true;$('end').hidden=true;$('game').hidden=false;renderDots();render();say(t().hello);}
function flash(id,cls){const el=document.querySelector(`.slot[data-id="${id}"]`);if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1500);}
function tryDrop(itemId,slotId){
const item=S.items.find(i=>i.id===itemId),slot=S.slots.find(s=>s.id===slotId);if(!item||!slot||S.placed.has(slotId))return;
if(isMatch(item,slot)){S.placed.add(itemId);S.sel=null;render();
 if(S.placed.size===S.items.length)finishLevel();else say(pick(t().ok));}
else{S.errors++;S.errItem[itemId]=(S.errItem[itemId]||0)+1;
 const bad=document.querySelector(`.slot[data-id="${slotId}"]`);if(bad){bad.classList.add('wrong');setTimeout(()=>bad.classList.remove('wrong'),500);}
 if(needsHint(S.errItem[itemId])){S.hints++;flash(itemId,'hint');say(t().hint);}else say(pick(t().retry));}}
function finishLevel(){S.done=Math.max(S.done,S.level);badgesFor(S).forEach(b=>S.badges.add(b));
if(S.level>=TOTAL_LEVELS){finalBadges(S.done).forEach(b=>S.badges.add(b));showEnd();return;}
say(t().levelDone);$('next').hidden=false;$('next').focus();}
function showEnd(){$('game').hidden=true;$('end').hidden=false;
const L=[...S.badges].map(k=>{const b=t().badges[k];return `<li class="badge"><b>${b[0]}</b>${b[1]}<small>${b[2]}</small></li>`;}).join('');
$('badges').innerHTML=L;say(t().endT);}
// Glisser-déposer + toucher pour sélectionner
let drag=null;
$('tray').addEventListener('pointerdown',e=>{const b=e.target.closest('.item');if(!b)return;drag={b,x:e.clientX,y:e.clientY,moved:false};try{b.setPointerCapture(e.pointerId);}catch(_){}});
$('tray').addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){drag.b.classList.add('drag');drag.b.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;}});
$('tray').addEventListener('pointerup',e=>{if(!drag)return;const{b,moved}=drag;drag=null;const id=+b.dataset.id;
if(!moved){S.sel=S.sel===id?null:id;render();return;}
b.style.pointerEvents='none';const el=document.elementFromPoint(e.clientX,e.clientY);b.style.pointerEvents='';b.style.transform='';b.classList.remove('drag');
const slot=el&&el.closest('.slot');if(slot)tryDrop(id,+slot.dataset.id);else render();});
$('tray').addEventListener('pointercancel',()=>{drag=null;render();});
$('tray').addEventListener('click',e=>{const b=e.target.closest('.item');if(b&&e.detail===0){const id=+b.dataset.id;S.sel=S.sel===id?null:id;render();const n=document.querySelector(`.item[data-id="${id}"]`);if(n)n.focus();}});
$('pots').addEventListener('click',e=>{const s=e.target.closest('.slot');if(s&&S.sel!==null)tryDrop(S.sel,+s.dataset.id);});
$('next').addEventListener('click',()=>startLevel(S.level+1));
$('again').addEventListener('click',()=>{S.badges=new Set();S.done=0;startLevel(1);});
$('snd').addEventListener('click',()=>{S.sound=!S.sound;if(!S.sound&&'speechSynthesis' in window)speechSynthesis.cancel();applyLang();});
$('lang').addEventListener('click',()=>{S.lang=S.lang==='fr'?'ar':'fr';try{localStorage.setItem('jdf-lang',S.lang);}catch(e){}applyLang();if(!$('end').hidden){showEnd();}else{renderDots();render();say(t().hello);}});
applyLang();startLevel(1);
</script>
</body>
</html>
